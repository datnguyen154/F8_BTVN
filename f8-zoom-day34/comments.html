<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Comment System</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
                color: #333;
                padding: 40px 20px;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
            }

            .comment-container {
                max-width: 700px;
                margin: 0 auto;
            }

            .comment-item {
                background-color: white;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
                margin-bottom: 16px;
            }

            .comment-item img {
                width: 48px;
                height: 48px;
                border-radius: 50%;
            }

            #root > div h3 {
                margin-bottom: 6px;
                font-size: 17px;
            }

            #root > div p {
                margin-bottom: 8px;
                line-height: 1.5;
            }

            #root > div p:nth-of-type(1) {
                color: #777;
                font-size: 14px;
            }

            #root > div small {
                color: #999;
            }

            form {
                background-color: white;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;

                display: flex;
                flex-direction: column;
                gap: 12px;

                margin-top: 24px;
            }

            input,
            textarea {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 14px;
                font-family: inherit;
            }

            textarea {
                min-height: 100px;
                resize: vertical;
            }

            input:focus,
            textarea:focus {
                outline: none;
                border-color: #2563eb;
            }

            button {
                width: fit-content;
                padding: 9px 16px;
                border: none;
                border-radius: 5px;
                background-color: #2563eb;
                color: white;
                font-size: 14px;
                cursor: pointer;
            }

            button:hover {
                background-color: #1d4ed8;
            }

            @media (max-width: 600px) {
                body {
                    padding: 24px 14px;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel">
            function Comment() {
                const [comments, setComments] = React.useState([]);
                const [name, setName] = React.useState("");
                const [email, setEmail] = React.useState("");
                const [body, setBody] = React.useState("");
                React.useEffect(() => {
                    fetch(
                        "https://jsonplaceholder.typicode.com/comments?postId=1",
                    )
                        .then((res) => res.json())
                        .then((comments) => setComments(comments));
                }, []);

                const handleSubmit = (e) => {
                    e.preventDefault();

                    if (!name.trim() || !email.trim() || !body.trim()) {
                        return;
                    }

                    const newComment = {
                        id: Date.now(),
                        name: name,
                        email: email,
                        body: body,
                        time: "Vừa xong",
                    };

                    setComments([newComment, ...comments]);

                    setName("");
                    setEmail("");
                    setBody("");
                };

                return (
                    <div className="comment-container">
                        <div className="comment-list">
                            {comments.map((comment) => (
                                <div key={comment.id}>
                                    <img
                                        src={`https://ui-avatars.com/api/?name=${encodeURIComponent(comment.name)}&background=random`}
                                        alt={comment.name}
                                    />

                                    <h3>{comment.name}</h3>

                                    <p>{comment.email}</p>

                                    <p>{comment.body}</p>

                                    <small>
                                        {comment.time || "2 giờ trước"}
                                    </small>
                                </div>
                            ))}
                            <form onSubmit={handleSubmit}>
                                <input
                                    type="text"
                                    placeholder="Tên"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                />

                                <input
                                    type="email"
                                    placeholder="Email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                />

                                <textarea
                                    placeholder="Nội dung bình luận"
                                    value={body}
                                    onChange={(e) => setBody(e.target.value)}
                                />

                                <button type="submit">Bình luận</button>
                            </form>
                        </div>
                    </div>
                );
            }
            const app = (
                <>
                    <h1>Comment System</h1>
                    <Comment />
                </>
            );
            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(app);
        </script>
    </body>
</html>
