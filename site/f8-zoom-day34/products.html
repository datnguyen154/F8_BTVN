<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product List</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
                color: #333;
                padding: 40px 20px;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
            }

            .product-list {
                max-width: 1000px;
                margin: 0 auto;
                padding: 0;

                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;

                list-style: none;
            }

            .product-list li {
                background-color: white;
                padding: 20px;

                border: 1px solid #ddd;
                border-radius: 8px;

                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .product-list li h2 {
                font-size: 18px;
                line-height: 1.4;
            }

            .product-list li p {
                line-height: 1.5;
            }

            .product-list li > p:first-child {
                font-size: 14px;
                color: #777;
            }

            button {
                width: fit-content;
                padding: 9px 14px;

                border: none;
                border-radius: 5px;

                background-color: #2563eb;
                color: white;

                cursor: pointer;
                font-size: 14px;
            }

            button:hover {
                background-color: #1d4ed8;
            }

            .product-list button {
                margin-top: auto;
            }

            /* Modal */

            .modal {
                position: fixed;
                inset: 0;

                background-color: rgba(0, 0, 0, 0.5);

                display: flex;
                justify-content: center;
                align-items: center;

                padding: 20px;
            }

            .modal-content {
                background-color: white;

                width: 500px;
                max-width: 100%;

                padding: 24px;
                border-radius: 8px;
            }

            .modal-content h2 {
                margin-bottom: 16px;
                line-height: 1.4;
            }

            .modal-content p {
                margin-bottom: 20px;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel">
            function Product() {
                const [products, setProducts] = React.useState([]);
                const [loading, setLoading] = React.useState(true);
                const [selectedProduct, setSelectedProduct] =
                    React.useState(null);

                React.useEffect(() => {
                    fetch(
                        "https://jsonplaceholder.typicode.com/posts?_limit=12",
                    )
                        .then((res) => res.json())
                        .then((data) => {
                            setProducts(data);
                            setLoading(false);
                        });
                }, []);
                if (loading) {
                    return <p>Đang tải...</p>;
                }

                return (
                    <>
                        <ul className="product-list">
                            {products.map((product) => (
                                <li key={product.id}>
                                    <p>{product.id}</p>
                                    <h2>
                                        {product.title.charAt(0).toUpperCase() +
                                            product.title.slice(1)}
                                    </h2>
                                    <p>
                                        {product.body.length > 100
                                            ? product.body.slice(0, 100) + "..."
                                            : product.body}
                                    </p>
                                    <button
                                        onClick={() =>
                                            setSelectedProduct(product)
                                        }
                                    >
                                        Xem chi tiết
                                    </button>
                                </li>
                            ))}
                        </ul>

                        {selectedProduct && (
                            <div className="modal">
                                <div className="modal-content">
                                    <h2>{selectedProduct.title}</h2>
                                    <p>{selectedProduct.body}</p>

                                    <button
                                        onClick={() => setSelectedProduct(null)}
                                    >
                                        Đóng
                                    </button>
                                </div>
                            </div>
                        )}
                    </>
                );
            }
            const app = (
                <>
                    <h1>Product List</h1>
                    <Product />
                </>
            );
            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(app);
        </script>
    </body>
</html>
