<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Counter App</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                background: white;
                border-radius: 20px;
                padding: 40px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                text-align: center;
                min-width: 320px;
            }

            h1 {
                color: #333;
                margin-bottom: 30px;
                font-size: 2rem;
            }

            .value {
                font-size: 4rem;
                font-weight: bold;
                margin: 20px 0;
                transition: all 0.3s ease;
            }

            .value.positive {
                color: #27ae60;
            }

            .value.negative {
                color: #e74c3c;
            }

            .value.zero {
                color: #95a5a6;
            }

            .status {
                font-size: 1.4rem;
                font-weight: 600;
                padding: 12px 24px;
                border-radius: 30px;
                margin: 20px 0 30px;
                display: inline-block;
                transition: all 0.3s ease;
            }

            .status.positive {
                background: #d4edda;
                color: #155724;
            }

            .status.negative {
                background: #f8d7da;
                color: #721c24;
            }

            .status.zero {
                background: #e2e3e5;
                color: #383d41;
            }

            .buttons {
                display: flex;
                gap: 15px;
                justify-content: center;
            }

            button {
                padding: 12px 28px;
                font-size: 1.1rem;
                font-weight: 600;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            }

            button:active {
                transform: translateY(0);
            }

            .btn-increase {
                background: #27ae60;
                color: white;
            }

            .btn-decrease {
                background: #e74c3c;
                color: white;
            }

            .btn-reset {
                background: #3498db;
                color: white;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel">
            function Counter() {
                const [value, setValue] = React.useState(0);

                const getStatus = () => {
                    if (value > 0)
                        return { text: "Dương", className: "positive" };
                    if (value < 0) return { text: "Âm", className: "negative" };
                    return { text: "Bằng không", className: "zero" };
                };

                const status = getStatus();

                return (
                    <div className="container">
                        <h2 className={`value ${status.className}`}>{value}</h2>
                        <div className={`status ${status.className}`}>
                            {status.text}
                        </div>
                        <div className="buttons">
                            <button
                                className="btn-increase"
                                onClick={() => setValue(value + 1)}
                            >
                                Tăng
                            </button>
                            <button
                                className="btn-decrease"
                                onClick={() => setValue(value - 1)}
                            >
                                Giảm
                            </button>
                            <button
                                className="btn-reset"
                                onClick={() => setValue(0)}
                            >
                                Reset
                            </button>
                        </div>
                    </div>
                );
            }
            const app = (
                <>
                    <h1>Counter App</h1>
                    <Counter />
                </>
            );
            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(app);
        </script>
    </body>
</html>
